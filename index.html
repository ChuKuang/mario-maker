<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2430" />
    <link rel="icon" href="data:," />
    <title>像素工坊 Blocksmith — 类马里奥制造</title>
    <script type="module" crossorigin src="./assets/index--68XtPTP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-q9TWyX9_.css">
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="像素工坊游戏画布"></canvas>

      <div id="hud">
        <!-- Play HUD -->
        <section id="play-hud" class="hidden" aria-live="polite">
          <div class="hud-cluster top-left">
            <div class="hud-chip">
              <span class="hud-label">关卡</span>
              <strong id="level-name">—</strong>
            </div>
            <div class="hud-chip coin-chip">
              <span class="coin-icon" aria-hidden="true"></span>
              <strong id="coin-value">00</strong>
            </div>
            <div class="hud-chip">
              <span class="hud-label">时间</span>
              <strong id="time-value">00:00</strong>
            </div>
            <div class="hud-chip">
              <span class="hud-label">阵亡</span>
              <strong id="death-value">0</strong>
            </div>
          </div>
          <div class="hud-cluster top-right">
            <div class="hud-hint" id="bgm-label">音乐</div>
            <button type="button" class="btn mute-btn" data-mute-toggle aria-pressed="false">🔊 音乐</button>
            <div class="hud-hint">二段跳 · 绿光=可踩 · 红环=禁踩 · Esc暂停 · R重开 · M静音</div>
          </div>
        </section>

        <!-- Editor HUD -->
        <section id="editor-hud" class="hidden">
          <div class="editor-bar">
            <div class="editor-meta">
              <strong id="editor-brush-label">地面</strong>
              <span id="editor-tool-label">画笔</span>
            </div>
            <div id="tool-palette" class="tool-palette">
              <button type="button" class="tool-btn" data-brush="0" title="橡皮 (0)">橡皮</button>
              <button type="button" class="tool-btn active" data-brush="1" title="地面 (1)">地面</button>
              <button type="button" class="tool-btn" data-brush="2" title="砖块 (2)">砖</button>
              <button type="button" class="tool-btn" data-brush="3" title="问号 (3)">?</button>
              <button type="button" class="tool-btn" data-brush="9" title="平台 (4)">平台</button>
              <button type="button" class="tool-btn" data-brush="5" title="水管 (5)">管</button>
              <button type="button" class="tool-btn" data-brush="10" title="尖刺 (6)">刺</button>
              <button type="button" class="tool-btn" data-brush="11" title="弹簧 (7)">弹</button>
              <button type="button" class="tool-btn" data-brush="12" title="冰面 (8)">冰</button>
              <button type="button" class="tool-btn" data-brush="13" title="熔岩 (9)">岩</button>
              <button type="button" class="tool-btn" data-brush="15" title="横向移动平台">横台</button>
              <button type="button" class="tool-btn" data-brush="16" title="纵向移动平台">竖台</button>
              <button type="button" class="tool-btn" data-brush="20" title="金币">币</button>
              <button type="button" class="tool-btn" data-brush="30" title="板栗仔 · 可踩（脚下绿光）">栗·踩</button>
              <button type="button" class="tool-btn" data-brush="31" title="乌龟 · 可踩（脚下绿光）">龟·踩</button>
              <button type="button" class="tool-btn" data-brush="32" title="刺猬 · 不可踩（红环+尖刺）">猬·禁</button>
              <button type="button" class="tool-btn" data-brush="50" title="终点旗">旗</button>
              <button type="button" class="tool-btn" data-brush="51" title="起点">起</button>
              <button type="button" class="tool-btn" data-brush="62" title="灌木">草</button>
              <button type="button" class="tool-btn" data-brush="60" title="云">云</button>
            </div>
            <div class="editor-actions">
              <button type="button" data-edit-action="play" class="btn primary">试玩 Enter</button>
              <button type="button" data-edit-action="save" class="btn">保存</button>
              <button type="button" data-edit-action="grid" class="btn">网格</button>
              <button type="button" data-edit-action="clear" class="btn">清空</button>
              <button type="button" data-edit-action="menu" class="btn">菜单</button>
            </div>
          </div>
        </section>

        <!-- Menu screen -->
        <section id="menu-screen" class="screen">
          <div class="menu-card">
            <div class="brand">
              <div class="brand-mark" aria-hidden="true"></div>
              <div>
                <h1>像素工坊</h1>
                <p class="tagline">类马里奥制造 · 搭建关卡，立刻开玩</p>
              </div>
            </div>
            <div class="menu-actions">
              <button type="button" class="btn primary" data-action="edit">进入编辑器</button>
              <button type="button" class="btn" data-action="blank">新建空白关</button>
              <button type="button" class="btn mute-btn" data-mute-toggle aria-pressed="false">🔊 音乐</button>
            </div>
            <div id="level-list" class="level-list"></div>
            <div class="controls-help">
              <div><kbd>A</kbd><kbd>D</kbd> 移动 · <kbd>Space</kbd> 跳跃/二段跳 · <kbd>Shift</kbd> 疾跑</div>
              <div>敌人：<span class="tag-ok">绿光脚下 = 可踩</span> · <span class="tag-bad">红环+尖刺 = 禁踩</span></div>
              <div>编辑：左键绘制 · 右键/<kbd>E</kbd> 擦除 · 数字键换笔刷</div>
            </div>
          </div>
        </section>

        <!-- Overlay -->
        <section id="overlay-screen" class="screen overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">关卡完成</h2>
            <p id="overlay-sub"></p>
            <div class="overlay-actions">
              <button type="button" class="btn primary" data-overlay-action="retry">重试</button>
              <button type="button" class="btn" data-overlay-action="resume">继续</button>
              <button type="button" class="btn" data-overlay-action="edit">编辑此关</button>
              <button type="button" class="btn" data-overlay-action="menu">回到菜单</button>
            </div>
          </div>
        </section>
      </div>

      <div id="touch-controls" class="hidden" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <div class="touch-buttons">
          <button id="dash-button" type="button" aria-label="疾跑">跑</button>
          <button id="jump-button" type="button" aria-label="跳跃">跳</button>
        </div>
      </div>
    </main>
  </body>
</html>
